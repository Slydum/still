name: Deploy Still to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STILL_DEPLOY_TARGET: github-pages
      VITE_SUPABASE_URL: https://hkezdsmpdnpnwvmqgkrx.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jFFuMaE4NEGZI7yc7SArRA_BVBIYlJH
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting baseline
        run: npm run format:check

      - name: Run type and source hygiene checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build the GitHub Pages app
        run: npm run build

      - name: Enforce production bundle budget
        run: npm run build:budget

      - name: Verify nested-base PWA output
        run: node scripts/verify-pages-build.mjs

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  live-pages-smoke:
    if: github.event_name != 'pull_request'
    name: live-pages-smoke
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    env:
      STILL_LIVE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout tested release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Smoke test deployed demo, routes, service worker, and offline reload
        run: node scripts/e2e-live-pages.mjs
