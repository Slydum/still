name: Phase 3 wire Life Area UI

on:
  push:
    branches: [v0.2-phase-3-connect-records]
    paths: [.github/workflows/phase3-wire-ui.yml]

permissions:
  contents: write

jobs:
  wire-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v0.2-phase-3-connect-records
      - name: Wire Phase 3 UI
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          # App route.
          replace(
              'src/app/App.tsx',
              "import { JournalPage } from '../features/journal/JournalPage';\n",
              "import { JournalPage } from '../features/journal/JournalPage';\nimport { LifeAreaPage } from '../features/life-area/LifeAreaPage';\n",
          )
          replace(
              'src/app/App.tsx',
              '        <Route path="/money" element={<MoneyPage />} />\n',
              '        <Route path="/money" element={<MoneyPage />} />\n        <Route path="/life/:areaId" element={<LifeAreaPage />} />\n',
          )

          # Dashboard: every Life Garden card opens its detail surface.
          replace(
              'src/features/dashboard/DashboardPage.tsx',
              "  route?: '/work' | '/money';\n",
              "  route: `/life/${'work' | 'love' | 'health' | 'money'}`;\n",
          )
          replace(
              'src/features/dashboard/DashboardPage.tsx',
              "  { key: 'work', label: 'Work', route: '/work', icon: stillAssets.tabs.work },\n  { key: 'love', label: 'Love', icon: stillAssets.tabs.love },\n  { key: 'health', label: 'Health', icon: stillAssets.tabs.health },\n  { key: 'money', label: 'Money', route: '/money', icon: stillAssets.tabs.finance },\n",
              "  { key: 'work', label: 'Work', route: '/life/work', icon: stillAssets.tabs.work },\n  { key: 'love', label: 'Love', route: '/life/love', icon: stillAssets.tabs.love },\n  { key: 'health', label: 'Health', route: '/life/health', icon: stillAssets.tabs.health },\n  { key: 'money', label: 'Money', route: '/life/money', icon: stillAssets.tabs.finance },\n",
          )
          replace(
              'src/features/dashboard/DashboardPage.tsx',
              "                aria-label={area.route ? `Open ${area.label}. ${status}` : `${area.label}. ${status}`}\n                className={`card garden-card ${area.key}`}\n                disabled={!area.route}\n                onClick={() => {\n                  if (area.route) navigate(area.route);\n                }}\n",
              "                aria-label={`Open ${area.label}. ${status}`}\n                className={`card garden-card ${area.key}`}\n                onClick={() => navigate(area.route)}\n",
          )

          # Quick Add imports and route-derived Life Area context.
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "import { useNavigate } from 'react-router-dom';\n",
              "import { useLocation, useNavigate } from 'react-router-dom';\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "import { getLocalDateKey } from '../../theme/stillContext';\n",
              "import { isLifeAreaId, type LifeAreaId } from '../../domain/lifeAreas';\nimport { getLocalDateKey } from '../../theme/stillContext';\nimport { LifeAreaPicker } from './LifeAreaPicker';\n",
          )

          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "function TaskEditor({ task, onCancel, onSave }: {\n  task?: StillTask;\n  onCancel: () => void;\n  onSave: (input: TaskInput) => void;\n}) {\n",
              "function TaskEditor({ task, initialAreaId, onCancel, onSave }: {\n  task?: StillTask;\n  initialAreaId?: LifeAreaId;\n  onCancel: () => void;\n  onSave: (input: TaskInput) => void;\n}) {\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "  const [repeat, setRepeat] = useState<TaskRepeat>(task?.repeat ?? 'none');\n",
              "  const [repeat, setRepeat] = useState<TaskRepeat>(task?.repeat ?? 'none');\n  const [areaId, setAreaId] = useState<LifeAreaId | undefined>(task?.areaId ?? initialAreaId);\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "    onSave({ title, note, dueDate, priority, repeat });\n",
              "    onSave({ title, note, dueDate, priority, repeat, areaId });\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "      </label>\n\n      <MoreOptions open={Boolean(task?.note || task?.dueDate || task?.repeat !== 'none' || task?.priority !== 'medium')}>\n",
              "      </label>\n      <LifeAreaPicker value={areaId} onChange={setAreaId} />\n\n      <MoreOptions open={Boolean(task?.note || task?.dueDate || task?.repeat !== 'none' || task?.priority !== 'medium')}>\n",
          )

          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "function EventEditor({ event, initialDate, onCancel, onSave }: {\n  event?: StillEvent;\n  initialDate?: string;\n  onCancel: () => void;\n  onSave: (input: EventInput) => void;\n}) {\n",
              "function EventEditor({ event, initialDate, initialAreaId, onCancel, onSave }: {\n  event?: StillEvent;\n  initialDate?: string;\n  initialAreaId?: LifeAreaId;\n  onCancel: () => void;\n  onSave: (input: EventInput) => void;\n}) {\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "  const [category, setCategory] = useState<EventCategory>(event?.category ?? 'personal');\n",
              "  const [category, setCategory] = useState<EventCategory>(event?.category ?? initialAreaId ?? 'personal');\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "            <span>Category</span>\n",
              "            <span>Life area</span>\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              '<option value="personal">Personal</option><option value="work">Work</option><option value="health">Health</option><option value="love">Love</option><option value="money">Money</option>',
              '<option value="personal">Personal / not connected</option><option value="work">Work</option><option value="health">Health</option><option value="love">Love</option><option value="money">Money</option>',
          )

          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "function JournalEditor({ entry, initialDate, draftContext, onCancel, onSave }: {\n  entry?: JournalEntry;\n  initialDate?: string;\n  draftContext?: JournalDraftContext;\n",
              "function JournalEditor({ entry, initialDate, initialAreaId, draftContext, onCancel, onSave }: {\n  entry?: JournalEntry;\n  initialDate?: string;\n  initialAreaId?: LifeAreaId;\n  draftContext?: JournalDraftContext;\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "  const [mood, setMood] = useState<JournalMood | undefined>(entry?.mood ?? draftContext?.suggestedMood);\n",
              "  const [mood, setMood] = useState<JournalMood | undefined>(entry?.mood ?? draftContext?.suggestedMood);\n  const [areaId, setAreaId] = useState<LifeAreaId | undefined>(entry?.areaId ?? initialAreaId);\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "    onSave({ title, body, entryDate, mood, tags: nextTags });\n",
              "    onSave({ title, body, entryDate, mood, tags: nextTags, areaId });\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "      <label className=\"task-field compact-date-field\">\n        <span>Date</span>\n        <input onChange={(event) => setEntryDate(event.target.value)} required type=\"date\" value={entryDate} />\n      </label>\n      <label className=\"task-field\">\n",
              "      <label className=\"task-field compact-date-field\">\n        <span>Date</span>\n        <input onChange={(event) => setEntryDate(event.target.value)} required type=\"date\" value={entryDate} />\n      </label>\n      <LifeAreaPicker value={areaId} onChange={setAreaId} />\n      <label className=\"task-field\">\n",
          )

          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "export function QuickAddSheet() {\n  const navigate = useNavigate();\n",
              "export function QuickAddSheet() {\n  const navigate = useNavigate();\n  const location = useLocation();\n  const routeAreaId = location.pathname.startsWith('/life/') ? location.pathname.split('/')[2] : undefined;\n  const currentLifeAreaId = isLifeAreaId(routeAreaId) ? routeAreaId : undefined;\n",
          )
          replace(
              'src/components/ui/QuickAddSheet.tsx',
              "          {mode === 'task' ? <TaskEditor key={editingTask?.id ?? 'new-task'} task={editingTask} onCancel={close} onSave={saveTask} />\n            : mode === 'event' ? <EventEditor key={editingEvent?.id ?? `new-event-${eventDraftDate ?? 'today'}`} event={editingEvent} initialDate={eventDraftDate} onCancel={close} onSave={saveEvent} />\n            : mode === 'journal' ? <JournalEditor key={editingJournalEntry?.id ?? `new-journal-${journalDraftDate ?? 'today'}-${journalDraftContext?.answer ?? 'plain'}`} entry={editingJournalEntry} initialDate={journalDraftDate} draftContext={journalDraftContext} onCancel={close} onSave={saveJournalEntry} />\n",
              "          {mode === 'task' ? <TaskEditor key={editingTask?.id ?? 'new-task'} task={editingTask} initialAreaId={currentLifeAreaId} onCancel={close} onSave={saveTask} />\n            : mode === 'event' ? <EventEditor key={editingEvent?.id ?? `new-event-${eventDraftDate ?? 'today'}`} event={editingEvent} initialDate={eventDraftDate} initialAreaId={currentLifeAreaId} onCancel={close} onSave={saveEvent} />\n            : mode === 'journal' ? <JournalEditor key={editingJournalEntry?.id ?? `new-journal-${journalDraftDate ?? 'today'}-${journalDraftContext?.answer ?? 'plain'}`} entry={editingJournalEntry} initialDate={journalDraftDate} initialAreaId={currentLifeAreaId} draftContext={journalDraftContext} onCancel={close} onSave={saveJournalEntry} />\n",
          )

          # Money remains intrinsic for expenses, but say so in the capture UI.
          replace(
              'src/components/ui/quick-add/ExpenseEditor.tsx',
              "      </div>\n\n      <details className=\"editor-more-options\">\n",
              "      </div>\n      <p className=\"subtle\">Expenses connect to Money automatically.</p>\n\n      <details className=\"editor-more-options\">\n",
          )

          Path('.github/workflows/phase3-wire-ui.yml').unlink()
      - name: Commit wired UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 3: connect records through Life Areas"
          git push origin HEAD:v0.2-phase-3-connect-records
