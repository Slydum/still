name: Phase 4 production smoke fix

on:
  push:
    branches:
      - fix/phase-4-reflection-production

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/phase-4-reflection-production
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply production smoke fix
        run: node scripts/apply-phase4-reflection-hotfix.mjs
      - name: Validate hotfix
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run security:audit
          npm run build
          npm run build:budget
          node scripts/e2e-demo-browser.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 4 reflection production smoke"
          git push
