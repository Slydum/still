name: Phase 4 reflection diagnostic

on:
  push:
    branches:
      - fix/phase-4-reflection-production

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/phase-4-reflection-production
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Diagnose deployed reflection route
        run: node scripts/diagnose-live-reflection.mjs
