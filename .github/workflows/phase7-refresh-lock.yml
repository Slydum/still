name: Phase 7 lockfile refresh

on:
  push:
    branches: [phase-7-release-security-hardening]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 7 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: phase-7-release-security-hardening
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh npm lockfile for React Router 8.3"
          git push origin HEAD:phase-7-release-security-hardening
