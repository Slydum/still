name: Apply Phase 5 sync confidence

on:
  push:
    branches:
      - v0.2-phase-5-sync-confidence

permissions:
  contents: write

concurrency:
  group: phase5-sync-confidence-apply
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: v0.2-phase-5-sync-confidence
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Phase 5 changes
        run: |
          node scripts/apply-phase5-sync-confidence.mjs
          rm scripts/apply-phase5-sync-confidence.mjs
          rm .github/workflows/phase5-sync-confidence-apply.yml
      - name: Validate Phase 5
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run security:audit
          npm run build
          npm run build:budget
          node scripts/e2e-demo-browser.mjs
      - name: Commit Phase 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.2 Phase 5: make sync state clear"
          git push origin HEAD:v0.2-phase-5-sync-confidence
