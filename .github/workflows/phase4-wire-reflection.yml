name: Phase 4 wire weekly reflection

on:
  push:
    branches:
      - v0.2-phase-4-weekly-reflection

permissions:
  contents: write

jobs:
  wire-reflection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: v0.2-phase-4-weekly-reflection
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wire reflection route and entry point
        run: node scripts/phase4-wire.mjs
      - name: Validate Phase 4
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run security:audit
          npm run build
          npm run build:budget
      - name: Commit wired reflection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/features/dashboard/DashboardPage.tsx src/features/reflection/weekly-reflection.css scripts/e2e-live-pages.mjs scripts/phase4-wire.mjs .github/workflows/phase4-wire-reflection.yml
          git commit -m "Phase 4: connect weekly reflection UI"
          git push
