name: Fix Phase 5 sync echo

on:
  push:
    branches:
      - v0.2-phase-5-sync-confidence

permissions:
  contents: write

concurrency:
  group: phase5-sync-echo-fix
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: v0.2-phase-5-sync-confidence
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply sync echo fix
        run: |
          node scripts/apply-phase5-sync-echo-fix.mjs
          rm scripts/apply-phase5-sync-echo-fix.mjs
          rm .github/workflows/phase5-sync-echo-fix.yml
      - name: Validate sync echo fix
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run security:audit
          npm run build
          npm run build:budget
          node scripts/e2e-demo-browser.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix sync acknowledgement echo writes"
          git push origin HEAD:v0.2-phase-5-sync-confidence
