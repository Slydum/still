name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: still-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Run browser demo and IndexedDB integration test
        run: node scripts/e2e-demo-browser.mjs

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start isolated Supabase stack
        run: npx -y supabase@2.109.1 start
      - name: Run database and RLS tests
        run: npx -y supabase@2.109.1 test db
      - name: Stop isolated Supabase stack
        if: always()
        run: npx -y supabase@2.109.1 stop --no-backup
