name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: still-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: app-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting baseline
        run: npm run format:check
      - name: Run type and source hygiene checks
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Audit dependencies
        run: npm run security:audit
      - name: Build production app
        run: npm run build
      - name: Enforce production bundle budget
        run: npm run build:budget
      - name: Run browser demo and IndexedDB integration test
        run: node scripts/e2e-demo-browser.mjs

  database-security:
    name: database-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Start isolated Supabase database
        run: >-
          npx -y supabase@2.109.1 start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run database and RLS tests
        run: npx -y supabase@2.109.1 test db
      - name: Stop isolated Supabase stack
        if: always()
        run: npx -y supabase@2.109.1 stop --no-backup
