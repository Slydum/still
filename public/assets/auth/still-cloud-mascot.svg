<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="still-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2edff"/>
      <stop offset="0.58" stop-color="#ded2ff"/>
      <stop offset="1" stop-color="#c9b7f4"/>
    </linearGradient>
    <linearGradient id="still-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.66" stop-color="#fbf8ff"/>
      <stop offset="1" stop-color="#eee7ff"/>
    </linearGradient>
    <linearGradient id="still-cloud-lavender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7ff"/>
      <stop offset="1" stop-color="#ded3fa"/>
    </linearGradient>
    <filter id="still-shadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#7861b7" flood-opacity="0.16"/>
    </filter>
    <filter id="still-soft-shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8870c5" flood-opacity="0.10"/>
    </filter>
  </defs>

